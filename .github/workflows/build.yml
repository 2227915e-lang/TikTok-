name: Build LiquidGlass IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Link de Google Drive del IPA'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Descargar IPA desde Google Drive
        run: |
          pip install gdown --quiet
          gdown "${{ github.event.inputs.ipa_url }}" -O gtok_2_5_3.ipa
          ls -lh gtok_2_5_3.ipa

      - name: Install insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -scheme insert_dylib -configuration Release BUILD_DIR=./build
          sudo cp build/Release/insert_dylib /usr/local/bin/insert_dylib

      - name: Compile LiquidGlass.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -install_name "@rpath/LiquidGlass.dylib" \
            -o LiquidGlass.dylib \
            LiquidGlass.m

      - name: Inject dylib into IPA
        run: |
          mkdir -p build_tmp
          unzip -q gtok_2_5_3.ipa -d build_tmp
          cp LiquidGlass.dylib build_tmp/Payload/TikTok.app/Frameworks/LiquidGlass.dylib
          insert_dylib \
            --strip-codesig \
            --inplace \
            "@rpath/LiquidGlass.dylib" \
            build_tmp/Payload/TikTok.app/TikTok
          cd build_tmp
          zip -qr ../gtok_2_5_3_liquidglass.ipa Payload/
          cd ..
          ls -lh gtok_2_5_3_liquidglass.ipa

      - name: Crear Release y subir IPA
        run: |
          gh release create "liquidglass-v1" \
            --title "TikTok LiquidGlass" \
            --notes "IPA modificado con liquid glass effect" \
            gtok_2_5_3_liquidglass.ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
